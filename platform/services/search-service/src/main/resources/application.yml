server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always

spring:
  application:
    name: search-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/searchops}
    username: ${SPRING_DATASOURCE_USERNAME:searchops}
    password: ${SPRING_DATASOURCE_PASSWORD:searchops_local_only}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

lab:
  search:
    elasticsearch-url: ${ELASTICSEARCH_URL:http://localhost:9200}
    index-alias: ${ELASTICSEARCH_INDEX_ALIAS:products-read}
    ai-adapter-url: ${AI_ADAPTER_URL:http://localhost:8000}
    # 默认值从 false 改为 true，与 .env / docker-compose.yml 对齐：三处不一致时，
    # 「AI 到底开没开」取决于启动方式，排查降级问题会得出相反结论。
    # true 是安全的：默认 provider 是无密钥的确定性 mock，且适配器不可达只会降级成
    # 纯 BM25（ai_status=TRANSPORT_ERROR），不会让搜索请求失败。
    # kill switch 仍然是 AI_ENABLED=false，此时 ai_status=DISABLED。
    ai-enabled: ${AI_ENABLED:true}
    # 读超时默认值从 400ms 抬到 5000ms：400ms 只够确定性 mock provider，真实 LLM 必然超时
    # 并触发静默 BM25 降级。仍可由 AI_TIMEOUT_MS 覆盖。
    ai-timeout-ms: ${AI_TIMEOUT_MS:5000}
    ai-connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:1000}
    approval-secret: ${SEARCHOPS_APPROVAL_SECRET:local-demo-approval-secret}
    processed-data-path: ${PROCESSED_DATA_PATH:/app/data/processed}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    lab.searchops: ${LOG_LEVEL:INFO}
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"search-service","request_id":"%X{requestId:-}","logger":"%logger{36}","message":"%replace(%m){''[\r\n]+'','' ''}"}%n'

