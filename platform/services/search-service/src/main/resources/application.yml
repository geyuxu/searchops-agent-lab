server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always

spring:
  application:
    name: search-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/searchops}
    username: ${SPRING_DATASOURCE_USERNAME:searchops}
    password: ${SPRING_DATASOURCE_PASSWORD:searchops_local_only}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

lab:
  search:
    elasticsearch-url: ${ELASTICSEARCH_URL:http://localhost:9200}
    index-alias: ${ELASTICSEARCH_INDEX_ALIAS:products-read}
    ai-adapter-url: ${AI_ADAPTER_URL:http://localhost:8000}
    # 默认值从 false 改为 true，与 .env / docker-compose.yml 对齐：三处不一致时，
    # 「AI 到底开没开」取决于启动方式，排查降级问题会得出相反结论。
    # true 是安全的：默认 provider 是无密钥的确定性 mock，且适配器不可达只会降级成
    # 纯 BM25（ai_status=TRANSPORT_ERROR），不会让搜索请求失败。
    # kill switch 仍然是 AI_ENABLED=false，此时 ai_status=DISABLED。
    ai-enabled: ${AI_ENABLED:true}
    # 读超时默认值从 400ms 抬到 5000ms：400ms 只够确定性 mock provider，真实 LLM 必然超时
    # 并触发静默 BM25 降级。仍可由 AI_TIMEOUT_MS 覆盖。
    ai-timeout-ms: ${AI_TIMEOUT_MS:5000}
    ai-connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:1000}
    approval-secret: ${SEARCHOPS_APPROVAL_SECRET:local-demo-approval-secret}
    processed-data-path: ${PROCESSED_DATA_PATH:/app/data/processed}
    # 候选集重排。与上面的改写配置**互相独立**：可以只开一个。
    # 注意：即使 enabled=true，也必须请求显式要求（/search?rerank=true 或评测
    # use_rerank=true）才会真的调用适配器，因此打开它不会改变任何既有流量的行为。
    rerank:
      # 重排 kill switch。关掉时 rerank_status=DISABLED；全局 AI_ENABLED=false 时
      # 则是 AI_DISABLED——两种"没启用"在响应里可区分。
      enabled: ${RERANK_ENABLED:true}
      # BM25 候选深度 N：取回 N 条送去重排，重排后截断回 size 条。
      # 默认 50 的依据：失败诊断显示相关商品排在 11-50 位占 30.3%、51-200 位占 27.3%，
      # N=50 覆盖前者全部；上限 200 是适配器 RerankRequest.candidates 的契约上限。
      depth: ${RERANK_DEPTH:50}
      # 重排专用读超时，与改写的 5000ms 分开。提示词含 N 条商品，延迟量级是秒，
      # 共用 5000ms 会让重排稳定超时并伪装成"重排没有收益"。取舍见 HttpConfig。
      timeout-ms: ${RERANK_TIMEOUT_MS:15000}
      # 同时在途的重排调用上限，超出即立即降级（rerank_status=OVERLOADED）。
      # 前台搜索同步阻塞在 Tomcat 工作线程上，这道闸门保证慢重排吃不光线程池。
      max-concurrency: ${RERANK_MAX_CONCURRENCY:8}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    lab.searchops: ${LOG_LEVEL:INFO}
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"search-service","request_id":"%X{requestId:-}","logger":"%logger{36}","message":"%replace(%m){''[\r\n]+'','' ''}"}%n'

